<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modal Css / no js</title>
    <style>
   
* {
    box-sizing: border-box;
}

body {
    margin: 0;
}

a.button {
    text-decoration: none;
    color: white;
    background-color: blueviolet;
    padding: 1rem 2rem;
    border-radius: .75rem;
    display: inline-block;
}

/* modal styles */
.info_modal {
    /* stretch the div to cover the entire screen */
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    /* transparent div */
    background-color: rgba(0, 0, 0, 0.3);
    /* make the modal is in front of all other elements on the screen */
    z-index: 100;
    /* invisible by default */
   /* opacity: 0; */
   /* we always define our transitions on the starting state */
    transition: opacity 400ms ease-in;
    /* make sure we can't click anything behind the overlay */
    pointer-events: none;

}   

/* this selector grabs only the targeted id from our anchor tag click event */
.info_modal:target {
    /* make the modal visible */
    opacity: 1;
    /* allow us to click on the modal */
    pointer-events: auto;
}

.center {
    display: flex;
    justify-content: center;
    align-items: center;
}

.info_modal > div {
    background-color: white;
    width: 600px;
    height: 600px;
    padding: 2rem;
    border-radius: .75rem;
    position: relative;
}

.close {
    height: 20px;
    width: 20px;
    background-color: antiquewhite;
    position: absolute;
    top: 0;
    right: 0;
}


    </style>
</head>
<body>
<!--anchor tags that target another elemenr on the cage with a specific ID-->
<!--anchhor tags with a class to make them look like buttons-->
<a href="#info" class="button">Open Modal</a>
<!--another link/button with a different id targeted to open a different modal-->
<a href="#info2" class="button">Open Modal 2</a>

<!-- your normal website ocntent goes here-->



<!-- put the modals at the end of the file so we dont get confused-->
<!-- begin modal 1 -->
 <!-- parent wrapper div which will have the id to anchor tah that looks like a button targets-->
  <!-- this div is also our transparent overlay that covers the entire page-->
<div id="info" class="info_modal center">
    <!-- pop up window out/in the overlay-->
  <div>
    <!-- close button that targets an id that doesnt exist on the page to remove our info modal as the selected target-->
    <a href="#close" class="close">X</a>
    <h1> Hello Modal 1</h1>
    <p> This is our first CSS only Modal!</p>
  </div>
  </div>

<!-- end modal 1 -->

<!-- begin modal 2 -->
 <!-- parent wrapper div which will have the id to anchor tah that looks like a button targets-->
  <!-- this div is also our transparent overlay that covers the entire page-->
<div id="info_2" class="info_2_modal center">
    <!-- pop up window out/in the overlay-->
  <div>
    <!-- close button that targets an id that doesnt exist on the page to remove our info modal as the selected target-->
    <a href="#close" class="close">X</a>
    <h1> Hello Modal 1</h1>
    <p> This is our second CSS only Modal!</p>
  </div>
  </div>

<!-- end modal 2 -->

</body>
</html>
