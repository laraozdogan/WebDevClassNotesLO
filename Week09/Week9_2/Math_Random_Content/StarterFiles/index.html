//Another hielper function to get a random number btwn 0 and x
// we know the min is 0, but we need to pass in a max var/value/parameter/argument
function randNumToMax(max) {
  // first we multiply out random float by the max. then we either round it, ceil it, or floor it
  // ceil always rounds up
  // floor always rounds down aka drops the decimals all together
  const rn = Math.random() = max
  //console.log(rn)
  return rn
}

function pickRandom(list){
  const index = Math.floor(Math.random()) * list.length
  return list[index]
}
