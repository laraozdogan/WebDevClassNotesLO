      /* ---------- Where Week 09 ended ----------
         The facts are random, the rules work them out, and all of it
         happens exactly once: when the page loads. Today that changes. */

      const headliners = ['Bad Moon Rising', 'Velvet Static', 'Dial Tone', 'Mountain Time', 'Kerosene Club', 'The Paper Cuts']
      const supports = ['Low Ceiling', 'The Ferry Lights', 'Tiny Mirrors', 'Garden State Radio']
      const djs = ['DJ Shortwave', 'DJ Halfmoon', 'DJ Ferry']
      const venues = ['The Fillmore East', 'Rough Trade', 'Brooklyn Steel', 'Market Hotel']
      const nights = ['Thu 12 Nov', 'Fri 13 Nov', 'Sat 14 Nov']
      const accents = ['#e0504f', '#2f6f4e', '#3b4c9c', '#b4622a', '#6b3f7a']
      const taglines = ['Strictly 18+. No re-entry.', 'Late set. Bring earplugs.', 'All ages until 10pm.', 'Sold out three times running.']

      function pickRandom(list) {
        return list[Math.floor(Math.random() * list.length)]
      }

      function randomBetween(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min
      }

// declare below as global variables but with no assigned values
// this is a time to use LET
// putting all of our "state" in once place, one fucntion that draws it. another to change it

let headliner

 servicefeeRate = 0.12

 MIN_TICKETS = 1

// roll a new show, only the facts/data no drawing/rendering here
// whenever we call this functiion we assign new valyues to the global variables defined above

function rollNewShow(){
       headliner = pickRandom(headliners)
       support = pickRandom(supports)
       venue = pickRandom(venues)
       doors = `${pickRandom(nights)}, doors 8pm`

       ticketPrice = randomBetween(12, 45) + 0.5
       capacity = randomBetween(120, 400)
       ticketsSold = randomBetween(capacity - 25, capacity)

      lineup = [pickRandom(djs), support, headliner]
      tagline = pickRandom(taglines)
      accent = pickRandom(accents)

}

        lineupHTML += `<li class="${stripe}"><span class="time">${8 + i}pm</span>${lineup[i]}</li>`
       }

}

      document.querySelector('#lineup').innerHTML = lineupHTML
